<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>OwlHacks 2026</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }
      .container {
        text-align: center;
      }
      h1 {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello OwlHacks 2026!</h1>
      <p>We are using Node.js <span id="node-version"></span>,
      Chromium <span id="chrome-version"></span>,
      and Electron <span id="electron-version"></span>.</p>
    </div>
    <script>
      if (typeof process !== 'undefined' && process.versions) {
        document.getElementById('node-version').innerText = process.versions.node || 'N/A';
        document.getElementById('chrome-version').innerText = process.versions.chrome || 'N/A';
        document.getElementById('electron-version').innerText = process.versions.electron || 'N/A';
      }
    </script>
  </body>
</html>
